name: Build and Publish Docker Images

on:
  push:
    branches: [main]
    paths:
      - "u*/**"
      - "common/**"
      - "cli/**"
      - "install.sh"
      - "scripts/docker-dev"
      - ".github/workflows/build-images.yml"
      - "README.md"
  pull_request:
    branches: [main]
    paths:
      - "u*/**"
      - "common/**"
      - "cli/**"
      - "install.sh"
      - "scripts/docker-dev"
      - ".github/workflows/build-images.yml"
      - "README.md"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}

jobs:
  detect-changes:
    name: Detect Changed Images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.detect.outputs.images }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed images
        id: detect
        run: |
          IMAGES=()
          if git diff --name-only origin/main...HEAD | grep -q "^u2204dev/"; then
            IMAGES+=("u2204dev")
          fi
          if git diff --name-only origin/main...HEAD | grep -q "^u2404dev/"; then
            IMAGES+=("u2404dev")
          fi
          if git diff --name-only origin/main...HEAD | grep -q "^u2604dev/"; then
            IMAGES+=("u2604dev")
          fi
          if [ ${#IMAGES[@]} -eq 0 ]; then
            IMAGES=("u2204dev" "u2404dev" "u2604dev")
          fi
          # Convert to compact single-line JSON array
          JSON_IMAGES=$(printf '%s\n' "${IMAGES[@]}" | jq -R . | jq -s . | jq -c)
          echo "images=${JSON_IMAGES}" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.image }} (${{ matrix.profile }})
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.detect-changes.outputs.images) }}
        profile: [ai-full, minimal, standard]
        include:
          - image: u2204dev
            dockerfile: u2204dev/Dockerfile
            context: .
          - image: u2404dev
            dockerfile: u2404dev/Dockerfile
            context: .
          - image: u2604dev
            dockerfile: u2604dev/Dockerfile
            context: .
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU for multi-architecture builds
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ matrix.profile == 'ai-full' }}
            type=raw,value=latest-minimal,enable=${{ matrix.profile == 'minimal' }}
            type=raw,value=latest-standard,enable=${{ matrix.profile == 'standard' }}
            type=sha,enable=${{ matrix.profile == 'ai-full' }}
            type=ref,event=branch,enable=${{ matrix.profile == 'ai-full' }}
            type=semver,pattern={{version}},enable=${{ matrix.profile == 'ai-full' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ matrix.profile == 'ai-full' }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: |
            DEV_IMAGE_PROFILE=${{ matrix.profile }}
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.profile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.profile }}
          provenance: true

      - name: Generate Artifact Attestation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.profile == 'ai-full'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Security Scan with Trivy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.profile == 'ai-full'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: '${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.meta.outputs.version }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.profile == 'ai-full'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
          category: '/${{ matrix.image }}'

      - name: Inspect final image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.profile == 'ai-full'
        run: |
          image_ref="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}"
          echo "=== ${image_ref} ==="
          docker buildx imagetools inspect "${image_ref}:latest"
