<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240">
  <defs>
    <linearGradient id="d_top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="d_left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="d_green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="d_blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="shadowD" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g transform="translate(50, 30)">
    <!-- Box Icon -->
    <g filter="url(#shadowD)">
      <!-- Top Face -->
      <polygon points="85,12 155,48 85,84 15,48" fill="url(#d_top)" stroke="#0f172a" stroke-width="7" stroke-linejoin="round"/>
      
      <!-- Top Window Dots (Green, Blue, Slate) -->
      <g transform="translate(85, 48) rotate(-27) skewX(-30) scale(0.9)">
        <circle cx="-35" cy="-6" r="7.5" fill="#10b981"/>
        <circle cx="-10" cy="-6" r="7.5" fill="#0284c7"/>
        <circle cx="15" cy="-6" r="7.5" fill="#94a3b8"/>
      </g>

      <!-- Left Face (Dark Terminal Screen) -->
      <polygon points="15,48 85,84 85,168 15,132" fill="url(#d_left)" stroke="#0f172a" stroke-width="7" stroke-linejoin="round"/>

      <!-- Glowing Terminal Prompt on Left Face -->
      <g stroke="#34d399" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M 35,94 L 53,105 L 35,116"/>
        <line x1="57" y1="126" x2="69" y2="120"/>
      </g>
      <!-- Dev AI Spark -->
      <path d="M 62,72 Q 62,77 67,77 Q 62,77 62,82 Q 62,77 57,77 Q 62,77 62,72 Z" fill="#6ee7b7"/>

      <!-- Right Face (Crisp Docker/Infra slate-blue) -->
      <polygon points="85,84 155,48 155,132 85,168" fill="#f8fafc" stroke="#0f172a" stroke-width="7" stroke-linejoin="round"/>
      
      <!-- Container Code / Ribs on Right Face -->
      <g stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M 106,102 L 96,110 L 106,120"/>
        <path d="M 132,88 L 142,96 L 132,106"/>
        <line x1="123" y1="91" x2="116" y2="120"/>
      </g>
    </g>

    <!-- Typography -->
    <g transform="translate(200, -5)">
      <text x="0" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="88" letter-spacing="-1.8">
        <tspan fill="#0f172a">dev</tspan><tspan fill="#10b981">box</tspan>
      </text>
      <text x="4" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="25" fill="#64748b" letter-spacing="-0.3">
        Curated dev environments, containerized.
      </text>
    </g>
  </g>
</svg>